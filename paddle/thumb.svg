<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17223A"/><stop offset="1" stop-color="#16251E"/>
    </linearGradient>
    <radialGradient id="orbGlow"><stop offset="0" stop-color="#FF4FA3" stop-opacity="0.5"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35"><stop offset="0" stop-color="#FF8BC6"/><stop offset="1" stop-color="#B0206A"/></radialGradient>
  </defs>
  <rect width="320" height="140" fill="url(#court)"/>
  <line x1="0" y1="70" x2="320" y2="70" stroke="#fff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="160" cy="70" r="26" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- Kevin, smug at the top -->
  <rect x="120" y="12" width="64" height="10" rx="5" fill="#5CC2FF"/>
  <circle cx="142" cy="17" r="3" fill="#fff"/><circle cx="162" cy="17" r="3" fill="#fff"/>
  <circle cx="143" cy="17.6" r="1.5" fill="#0D131A"/><circle cx="163" cy="17.6" r="1.5" fill="#0D131A"/>
  <!-- His speech bubble -->
  <rect x="196" y="6" width="104" height="24" rx="9" fill="#F4F7FB"/>
  <path d="M196 14 l-8 4 l8 3 z" fill="#F4F7FB"/>
  <text x="248" y="22.5" font-family="Arial" font-weight="900" font-size="12" text-anchor="middle" fill="#14223A">Too easy.</text>
  <!-- A mystery orb and the ball -->
  <circle cx="92" cy="66" r="22" fill="url(#orbGlow)"/>
  <circle cx="92" cy="66" r="9" fill="url(#orb)"/>
  <text x="92" y="70" font-family="Arial" font-weight="900" font-size="11" text-anchor="middle" fill="#fff">?</text>
  <circle cx="214" cy="94" r="4" fill="#fff" opacity="0.25"/>
  <circle cx="204" cy="86" r="4.5" fill="#fff" opacity="0.4"/>
  <circle cx="193" cy="77" r="6" fill="#fff"/>
  <!-- You, drunk at the bottom -->
  <g transform="rotate(-6 150 124)">
    <rect x="114" y="119" width="72" height="10" rx="5" fill="#C99CFF"/>
  </g>
  <text x="246" y="122" font-family="Arial" font-weight="900" font-size="14" fill="#B98AF0" stroke="#0D131A" stroke-width="3" paint-order="stroke">DRUNK!</text>
</svg>
